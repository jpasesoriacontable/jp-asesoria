<title>JP Asesoría Contable</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mu:#667085;--bd:#e2e6ec;--ac:#0b6e4f;--acx:#fff;--wr:#b54708;--ok:#0b6e4f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b222b;--tx:#e8ecf1;--mu:#9aa5b4;--bd:#2c3642;--ac:#3ecf9a;--acx:#06251a;--wr:#f5a35c;--ok:#3ecf9a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b222b;--tx:#e8ecf1;--mu:#9aa5b4;--bd:#2c3642;--ac:#3ecf9a;--acx:#06251a;--wr:#f5a35c;--ok:#3ecf9a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:960px;margin:0 auto;padding:14px}
h1{font-size:19px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;min-width:0}
button{cursor:pointer}button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button.x{color:var(--wr);padding:4px 8px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabs button{white-space:nowrap}.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
td.n,th.n{text-align:right}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kp div{border:1px solid var(--bd);border-radius:10px;padding:10px}
.kp b{display:block;font-size:19px}.kp span{color:var(--mu);font-size:12px}
.mu{color:var(--mu);font-size:13px}.ok{color:var(--ok)}.wr{color:var(--wr)}
textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px}
.dz{border:2px dashed var(--bd);border-radius:10px;padding:14px;text-align:center}
label.l{font-size:12px;color:var(--mu);display:block}
.hd{display:flex;align-items:center;gap:12px;background:#0b0b0b;border-radius:12px;padding:10px 14px;margin-bottom:12px}.hd img{width:56px;height:56px;border-radius:50%;object-fit:cover}.hd b{display:block;color:#d9b45f;font-size:19px;font-family:Georgia,serif}.hd span{color:#cfc7b4;font-size:12px}
#st:not(:empty){position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;z-index:50;background:var(--ac);color:var(--acx);padding:10px 12px;border-radius:10px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.3)}

function m(x){return (x||0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2})}

function delC(){var c=C();if(!c)return;if(!window._dc){window._dc=1;msg('Toca Eliminar otra vez para borrar a '+c.name+' y todos sus datos');setTimeout(function(){window._dc=0},5000);return}window._dc=0;S.clients=S.clients.filter(function(x){return x!==c});S.sel=S.clients[0]?S.clients[0].id:null;save();draw();msg('Cliente eliminado')}
function num(s){s=String(s==null?'':s).replace(/[^\d.,-]/g,'');if(!s)return 0;var a=s.lastIndexOf(','),b=s.lastIndexOf('.');
 if(a>-1&&b>-1){s=a>b?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'')}else if(a>-1){s=/,\d{1,2}$/.test(s)?s.replace(',','.'):s.replace(/,/g,'')}
 return parseFloat(s)||0}
function dt(s){s=String(s||'').trim();var r;if(r=s.match(/^(\d{4})-(\d{2})-(\d{2})/))return r[1]+'-'+r[2]+'-'+r[3];
 if(r=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/)){var y=r[3].length==2?'20'+r[3]:r[3];return y+'-'+('0'+r[2]).slice(-2)+'-'+('0'+r[1]).slice(-2)}return ''}
function csv(t){var sep=(t.split(';').length>t.split(',').length)?';':(t.indexOf('\t')>-1?'\t':',');var rows=[],r=[],f='',q=false;
 for(var i=0;i<t.length;i++){var ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=ch}
 else if(ch=='"')q=true;else if(ch==sep){r.push(f);f=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';if(r.some(function(x){return x.trim()}))rows.push(r);r=[]}else f+=ch}
 r.push(f);if(r.some(function(x){return x.trim()}))rows.push(r);return rows}
function col(h,names){for(var i=0;i<h.length;i++){var k=h[i].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();if(names.some(function(n){return k.indexOf(n)>-1}))return i}return -1}
function ln(el,n){return Array.prototype.filter.call(el.getElementsByTagName('*'),function(e){return e.localName===n})}
function tx(el,n){var x=el&&ln(el,n)[0];return x?x.textContent.trim():''}
function readXml(t,c,fn){var d=new DOMParser().parseFromString(t,'text/xml');if(d.getElementsByTagName('parsererror').length)return null;
 var root=d.documentElement,sg=root.localName==='CreditNote'?-1:1;
 var sup=ln(root,'AccountingSupplierParty')[0],cus=ln(root,'AccountingCustomerParty')[0];
 var sr=tx(sup,'ID'),cr=tx(cus,'ID'),lm=ln(root,'LegalMonetaryTotal')[0];
 var base=num(tx(lm,'LineExtensionAmount')),tot=num(tx(lm,'PayableAmount')),tt=ln(root,'TaxTotal')[0],igv=num(tx(tt,'TaxAmount'));
 var lines=ln(root,sg<0?'CreditNoteLine':'InvoiceLine').map(function(l){var q=ln(l,'InvoicedQuantity')[0]||ln(l,'CreditedQuantity')[0],it=ln(l,'Item')[0];return {q:sg*num(q?q.textContent:0),u:q?(q.getAttribute('unitCode')||''):'',d:tx(it,'Description')||'(sin descripción)',cod:tx(ln(l,'SellersItemIdentification')[0],'ID'),v:sg*num(tx(l,'LineExtensionAmount'))}});var tipo='venta';if(c.ruc){if(cr===c.ruc)tipo='compra';else if(sr===c.ruc)tipo='venta'}
 var ter=tipo==='venta'?(tx(cus,'RegistrationName')||cr):(tx(sup,'RegistrationName')||sr);
 return {id:'i'+Math.random().toString(36).slice(2),tipo:tipo,fecha:dt(tx(root,'IssueDate')),num:tx(root,'ID')||fn,ter:ter,base:sg*base,igv:sg*igv,tot:sg*(tot||base+igv),mon:tx(root,'DocumentCurrencyCode')||'PEN',lin:lines}}
function upFac(files){files=Array.from(files);var c=C();var pf=files.filter(function(f){return /\.pdf$/i.test(f.name)});if(pf.length&&c){upPdf(pf);files=files.filter(function(f){return !/\.pdf$/i.test(f.name)});if(!files.length)return}if(!c)return msg('Crea un cliente primero');var n=0,p=files.length;
 Array.prototype.forEach.call(files,function(f){var rd=new FileReader();rd.onload=function(){var t=rd.result;
  if(/\.xml$/i.test(f.name)||/^\s*(<\?xml|<(Invoice|CreditNote)\b)/.test(t)){var o=readXml(t,c,f.name);if(o){c.inv.push(o);n++}}
  else if(/\.(csv|txt)$/i.test(f.name)){var rows=csv(t),h=rows[0]||[];var ci={t:col(h,['tipo']),f:col(h,['fecha']),n:col(h,['numero','nro','serie','comprobante']),r:col(h,['tercero','cliente','proveedor','razon']),b:col(h,['base','subtotal','valor']),i:col(h,['igv']),o:col(h,['total','importe'])};
   rows.slice(1).forEach(function(r){var b=num(r[ci.b]),i=num(r[ci.i]),o=ci.o>-1?num(r[ci.o]):b+i;if(!b&&!o)return;if(!b)b=o-i;

function upBank(files){var c=C();if(!c)return;var f=files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){var rows=csv(rd.result),h=rows[0]||[];

function pickDrive(k){

function showPicker(tok,k){gapi.load('picker',function(){var v=new google.picker.DocsView().setIncludeFolders(false);

function pdfRows(file){return file.arrayBuffer().then(function(buf){return pdfjsLib.getDocument({data:buf}).promise}).then(function(pdf){var ps=[];for(var i=1;i<=pdf.numPages;i++)ps.push(pdf.getPage(i).then(function(pg){return pg.getTextContent()}).then(function(tc){var rows=[];tc.items.forEach(function(t){if(!t.str.trim())return;var y=t.transform[5],x=t.transform[4],r=rows.filter(function(r){return Math.abs(r.y-y)<2.5})[0];if(!r){r={y:y,it:[]};rows.push(r)}r.it.push({x:x,s:t.str})});rows.sort(function(a,b){return b.y-a.y});return rows.map(function(r){return r.it.sort(function(a,b){return a.x-b.x}).map(function(t){return t.s}).join(' ').replace(/\s+/g,' ').trim()})}));return Promise.all(ps)})}
function pdfFactura(L,c){var T=L.join('\n'),g=function(re){var m=T.match(re);return m?m[1]:''};

 if(!base){base=Math.round(tot/(1+c.igv/100)*100)/100;igv=Math.round((tot-base)*100)/100}
 var re=g(/R\.?\s?U\.?\s?C\.?\s*:?\s*(\d{11})/),rc=g(/IDENTIDAD\s*:?\s*RUC\s*(\d{11})/);

 var ter;if(tipo==='compra'){ter=L[0]||re}else{var k=-1;L.forEach(function(x,i){if(k<0&&/SE.OR\s*:?/.test(x))k=i});
  if(k<0)ter=rc;else{var s=L[k].replace(/^.*SE.OR\s*:?\s*/,'').trim(),nx=L[k+1];if(!s){s=L[k-1]||rc}if(nx&&nx.indexOf(':')<0&&nx.length<30)s+=' '+nx;ter=s}}
 var items=[];for(var i=1;i<L.length;i++){var m=L[i].match(/^(?:(\d+)\s+)?([A-Z]{2,3})\s+(\d+(?:[.,]\d+)?)\s*[Xx]\s*(\d[\d.,]*)$/);if(!m)continue;
  var p=L[i-1].match(/^(\d{8,13})\s*(\S.*?)\s+(\d[\d.,]*)$/);if(!p)continue;
  items.push({q:num(m[3]),u:m[2],d:p[2].trim(),cod:p[1]+(m[1]||''),v:Math.round(num(p[3])/(1+c.igv/100)*100)/100})}
 return {id:'i'+Math.random().toString(36).slice(2),tipo:tipo,fecha:dt(g(/FECHA DE EMISI.N\s*:?\s*(\d{2}\/\d{2}\/\d{4})/)),num:nm[1]+'-'+nm[2],ter:ter,base:base,igv:igv,tot:tot,mon:(g(/MONEDA\s*:?\s*([A-Z]{3})/)||'PEN'),lin:items}}
function upPdf(fs){var c=C();if(!c)return;if(!window.pdfjsLib)return msg('El lector de PDF aún no cargó, intenta de nuevo');
