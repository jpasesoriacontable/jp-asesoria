<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mu:#667085;--bd:#e2e6ec;--ac:#0b6e4f;--acx:#fff;--wr:#b54708;--ok:#0b6e4f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b222b;--tx:#e8ecf1;--mu:#9aa5b4;--bd:#2c3642;--ac:#3ecf9a;--acx:#06251a;--wr:#f5a35c;--ok:#3ecf9a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b222b;--tx:#e8ecf1;--mu:#9aa5b4;--bd:#2c3642;--ac:#3ecf9a;--acx:#06251a;--wr:#f5a35c;--ok:#3ecf9a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:960px;margin:0 auto;padding:14px}
h1{font-size:19px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;min-width:0}
button{cursor:pointer}button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button.x{color:var(--wr);padding:4px 8px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabs button{white-space:nowrap}.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
td.n,th.n{text-align:right}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kp div{border:1px solid var(--bd);border-radius:10px;padding:10px}
.kp b{display:block;font-size:19px}.kp span{color:var(--mu);font-size:12px}
.mu{color:var(--mu);font-size:13px}.ok{color:var(--ok)}.wr{color:var(--wr)}
textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px}
.dz{border:2px dashed var(--bd);border-radius:10px;padding:14px;text-align:center}
label.l{font-size:12px;color:var(--mu);display:block}
.hd{display:flex;align-items:center;gap:12px;background:#0b0b0b;border-radius:12px;padding:10px 14px;margin-bottom:12px}.hd img{width:56px;height:56px;border-radius:50%;object-fit:cover}.hd b{display:block;color:#d9b45f;font-size:19px;font-family:Georgia,serif}.hd span{color:#cfc7b4;font-size:12px}
#st:not(:empty){position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;z-index:50;background:var(--ac);color:var(--acx);padding:10px 12px;border-radius:10px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.3)}

.ks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:8px 0}.ks div{border:1px solid var(--bd);border-radius:10px;padding:8px}.ks span{display:block;color:var(--mu);font-size:12px}.ks b{font-size:16px}
@media print{#pr .ks{display:flex}}
